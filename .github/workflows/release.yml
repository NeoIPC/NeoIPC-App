name: release

# Build the DHIS2 app bundle and publish it as a GitHub Release, so each neoipc-app version is an
# immutable, reproducible release (the .zip a DHIS2 instance installs) rather than a moving branch.
# Releasing is a deliberate step: push a `v*` tag -> CI verifies the version, runs the validate gate,
# builds the bundle, then creates the Release (pre-release for a pre-release version) and attaches the
# .zip. Manual dispatch builds the bundle without releasing (a build smoke-test).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full tag history for the monotonic check

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn

      - name: Verify the release tag matches package.json
        # The tag (minus a leading v) must equal package.json's version, so a release is always cut from a
        # commit whose version declares exactly that version -- no tag/manifest drift. setup-node runs
        # first so this uses the pinned Node.
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"; ver="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$ver" != "$pkg" ]; then
            echo "::error::Release tag '$tag' (version $ver) does not match package.json ('$pkg'). Bump package.json to match before releasing."
            exit 1
          fi
          echo "Release tag matches package.json ($pkg)."

      - name: Reject a moved / retagged release tag
        # A tag push with created=false means an existing tag was force-moved. Releases are immutable --
        # cut a new version rather than re-pointing a tag. This replaces a duplicate-name check: a newly
        # created tag can never already exist, and checkout (fetch-depth: 0) includes the triggering tag.
        # (The created gate beats a Release-existence check here: this workflow creates the Release last,
        # so a run that failed after tagging but before publishing would leave a tag without a Release.)
        if: github.event_name == 'push' && github.event.created != true
        shell: bash
        run: |
          echo "::error::Tag '$GITHUB_REF_NAME' already existed and was moved; releases are immutable. Cut a new version instead."
          exit 1

      - name: Enforce monotonic version (per-line, semver-correct)
        # Reject a within-line version regression; a new major.minor line (and backports on older lines) are
        # allowed. Map a pre-release '-' -> '~' before `sort -V` so its tilde rule orders 0.0.1-alpha BEFORE
        # 0.0.1 (correct semver precedence).
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"; ver="${tag#v}"
          line="$(cut -d. -f1-2 <<<"$ver")."
          # fetch-depth: 0 includes the triggering tag; exclude it so the comparison uses the genuinely
          # previous tag on this line, not this release itself.
          mapfile -t vers < <(git tag -l 'v*' | sed 's/^v//' | grep -vxF "$ver" || true)
          same="$(printf '%s\n' "${vers[@]}" | grep -E "^${line//./\\.}" | sed 's/-/~/' | sort -V | sed 's/~/-/' | tail -1 || true)"
          if [ -n "$same" ]; then
            hi="$(printf '%s\n%s\n' "$same" "$ver" | sed 's/-/~/' | sort -V | sed 's/~/-/' | tail -1)"
            if [ "$hi" != "$ver" ]; then
              echo "::error::Release '$ver' is not greater than the last released '$same' on the ${line%.} line."
              exit 1
            fi
            echo "Monotonic OK: $ver > $same (line ${line%.})."
          else
            echo "Monotonic OK: new ${line%.} line."
          fi

      - run: yarn install --frozen-lockfile

      - name: Validate (typecheck + schema drift + tests)
        # The same gate as build-and-test.yml. A release must never ship a bundle that fails its own
        # typecheck, the DHIS2 schema-drift check, or its tests.
        run: yarn validate

      - name: Build the app bundle
        # d2-app-scripts build packs by default -> build/bundle/NeoIPC-<version>.zip (the installable
        # DHIS2 app). The archive is named from d2.config.js's `name`, not from
        # package.json's, and the two differ here. Offline build.
        run: yarn build

      - name: Create the Release and attach the bundle
        # Tag-driven: after a successful build, create the GitHub Release — its body this version's
        # CHANGELOG.md section; pre-release when the version carries a pre-release suffix, e.g. -alpha —
        # and attach the bundle .zip.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          ver="${tag#v}"
          pre=""; case "$tag" in *-*) pre="--prerelease";; esac
          # The body is this version's own CHANGELOG.md section rather than generated commit notes,
          # and the extraction IS the gate: a missing or empty section fails the release, with no
          # fallback to --generate-notes, which would silently restore what this replaces. The
          # heading is matched as a literal prefix, not as a pattern — a version carries `.` and `-`,
          # which a regex built from it would interpret, and the closing `]` is what stops
          # `0.0.1` matching the `0.0.1-alpha` heading. A section ends at the next version heading
          # or at the first link-reference definition (`[x.y.z]: https://…`), so the definitions
          # that follow the last section never become part of its release body. The
          # changelog-section job in build-and-test.yml runs the same program on every pull
          # request, so a section this would miss is found before a tag exists; the two copies
          # are kept identical.
          section="$(awk -v want="## [$ver]" '
            index($0, want) == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside && $0 ~ /^\[[^]]+\]: / { exit }
            inside { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no non-empty '## [$ver]' section. Describe this release before tagging."
            exit 1
          fi
          printf '%s\n' "$section" > "$RUNNER_TEMP/release-notes.md"
          echo "Release notes for $ver taken from CHANGELOG.md:"
          cat "$RUNNER_TEMP/release-notes.md"
          # Idempotent: an Actions re-run reuses the original push payload. If the Release already exists —
          # a prior run created it, or a person published it together with the tag — give it this
          # version's notes and re-attach the freshly built bundle rather than failing on create, so the
          # body is the changelog section on every path and never whatever the Release was created with.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; setting its notes and re-attaching the bundle."
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" $pre
            gh release upload "$tag" build/bundle/*.zip --clobber
          else
            gh release create "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" $pre build/bundle/*.zip
          fi
