name: build-and-test

# Runs the same validate gate the release workflow runs (typecheck + DHIS2 schema-drift check + tests),
# plus a bundle build smoke-test, on every push to main and PR -- so a regression is caught before a tag
# is ever cut. Offline; no DHIS2 API access.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue-ownership:
    # This repository owns i18n/en.pot; Weblate owns every i18n/<lang>.po and is their only writer. Two
    # writers on one catalogue is what conflicts every language at once — both sides rewrite adjacent header
    # lines inside a single hunk git cannot auto-merge — and here the prose rule stood alone: the guardrail
    # said "do not hand-edit a catalogue" while nothing could catch it, so a pull request doing exactly that
    # would simply have collided with Weblate's next write. This enforces it.
    name: Catalogue ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base commit to diff against; a shallow clone has neither side.
          fetch-depth: 0

      - name: Reject hand-written changes to Weblate-owned catalogues
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          # The pull request's own tip, NOT HEAD. On a pull_request event actions/checkout checks out
          # refs/pull/N/merge, a synthetic merge commit GitHub creates and commits under its own identity.
          # That commit touches a .po whenever both sides changed one, so a committer check against HEAD
          # rejects pull requests whose every real commit is Weblate's.
          head="${{ github.event.pull_request.head.sha }}"
          # i18n/en.pot is deliberately absent: it is this repository's, generated from the source by
          # `yarn i18n:extract`, and a run that changes a string is expected to commit it.
          owned='i18n/[^/]*\.po'
          # Weblate commits everything it pushes under this one identity, whoever wrote the translation, so a
          # per-commit committer check recognises Weblate's own output no matter who opened the pull request.
          # Verified against this repository's own first drain rather than assumed. Exempting by pull-request
          # author instead would reject the drain pull requests we open ourselves from weblate-app, whose
          # commits are Weblate's throughout — and would wave through a stray hand-written commit riding along
          # in a Weblate-authored one.
          #
          # Do not try to confirm this identity by reading `main`: the drains are squash-merged, which rewrites
          # each commit and makes the merger the committer, so every commit on `main` shows GitHub's identity
          # and none shows Weblate's. The identity is visible only on the pull-request branch — which is what
          # this gate inspects. The obvious check is the misleading one.
          weblate='hosted@weblate.org'

          # --no-renames matters: with rename detection on, git prints only a rename's DESTINATION, so
          # `git mv i18n/de.po elsewhere.po` plus a hand edit shows a path that cannot match the pattern and
          # the file escapes the gate entirely. Splitting renames into delete+add surfaces the owned source
          # path. Assigned separately from the grep so that a git failure cannot be swallowed by the `|| true`
          # and read as "nothing offending".
          if ! changed=$(git diff --name-only --no-renames "$base...$head"); then
            echo "::error::Could not diff $base...$head — the gate cannot vouch for this pull request."
            exit 1
          fi

          offending=""
          # `|| true` would ignore EVERY non-zero status; the contract this gate wants is narrower and is
          # stated in the loop below — grep's exit 1 means "no matches", which is how it says the input is
          # clean, and anything ABOVE 1 is grep itself failing. Collapsing the two lets a filter that could
          # not run read as "nothing owned was changed": measured under Actions' `bash -eo pipefail`, an
          # unrunnable pattern took the old form to "PASSED, exit 0" on a changed catalogue it should have
          # rejected. Not reachable while `$owned` is a literal that compiles — but "correct because today's
          # pattern happens to compile" is a property of the input rather than of this gate, which is the
          # same reasoning that closed the rename and word-splitting escapes above.
          #
          # `|| rc=$?` rather than a bare assignment: under `set -e` a failing command substitution ends the
          # step before the status can be inspected at all.
          rc=0
          matched=$(printf '%s\n' "$changed" | grep -E "^($owned)$") || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::The ownership filter could not run (grep exit $rc) — the gate cannot vouch for this pull request."
            exit 1
          fi
          # `while IFS= read -r`, not `for f in $(…)`: the unquoted expansion word-splits on IFS, so a
          # matching path containing a space arrives as two fragments, neither of which names a real file —
          # `git log -- i18n/de` returns nothing, the loop reads that as "no non-Weblate committers", and the
          # gate passes. Same shape as the two fail-opens below: an error state indistinguishable from the
          # clean state. Reachable only via a hand-created path, since Weblate's own `language_regex` cannot
          # produce one — but "correct because today's filemask happens to yield space-free paths" is a
          # property of the data, not of this gate.
          #
          # Fed by a here-string rather than a pipe: a piped `while` runs in a SUBSHELL, so every
          # `offending=` assignment would be discarded at `done` and the gate would pass on precisely the
          # files it had just rejected.
          while IFS= read -r f; do
            # A here-string always emits at least one line, so an empty match list arrives here as a single
            # empty string rather than as no iterations at all.
            [ -n "$f" ] || continue
            # The git call is separated from the grep deliberately. With `|| true` spanning the whole
            # pipeline, a git failure — a missing ref, an unreadable path — produced an empty string, which
            # this loop reads as "no non-Weblate committers" and the gate then PASSES. A guard whose error
            # path is indistinguishable from its success path fails open, which is the one direction it must
            # never fail. Only the grep's own "no matches" status is ignored, because that is its way of
            # saying the file is clean.
            if ! committers=$(git log --format='%ce' "$base".."$head" -- "$f"); then
              echo "::error::Could not read the commit history of $f — the gate cannot vouch for this pull request."
              exit 1
            fi
            # Not `grep -q`: it exits on the first hit, and SIGPIPE plus `pipefail` would then report the
            # pipeline as failed, which reads here as "no offence found" and silently passes.
            # Same narrowing as the filter above, and here the two statuses are load-bearing in opposite
            # directions: `grep -vFx` exits 1 when every committer IS Weblate — the clean case, which must
            # stay ignored — and 0 when a non-Weblate committer exists, which is the offence. So this cannot
            # become a bare `grep` with no `||` at all; 0 and 1 are both expected answers and only 2 and
            # above mean the filter failed.
            rc=0
            others=$(printf '%s\n' "$committers" | grep -vFx "$weblate") || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::The committer filter could not run for $f (grep exit $rc) — the gate cannot vouch for this pull request."
              exit 1
            fi
            if [ -n "$others" ]; then offending="${offending}${f}"$'\n'; fi
          done <<< "$matched"
          if [ -n "$offending" ]; then
            echo "::error::This pull request modifies Weblate-owned catalogues. Weblate is their only writer."
            # `|| continue`, not `[ -n "$f" ] && echo`: `$offending` ends in a newline and `echo` adds
            # another, so the last iteration reads "" and the `&&` short-circuits to status 1. That becomes
            # the loop's exit status, and under Actions' `bash --noprofile --norc -eo pipefail` it ends the
            # step right here — discarding every guidance line below, which is the whole point of the failure
            # path. The gate still rejects correctly; the person who tripped it just loses everything written
            # to help them fix it. The checking loop above already uses `|| continue` for this reason, and a
            # here-string rather than a pipe keeps the two loops the same shape.
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "::error file=$f::$f is owned by Weblate — make the change there, not here."
            done <<< "$offending"
            echo
            echo "Translations go through https://hosted.weblate.org/projects/neoipc/neoipc-app/"
            echo
            echo "Nothing in this repository writes these files, so a hand edit is the likely route:"
            # Single-quoted deliberately: backticks inside double quotes are command substitution, so the
            # unquoted form would try to RUN yarn from inside the failure message.
            echo '  yarn i18n:extract writes i18n/en.pot alone and never a .po, and yarn build only reads'
            echo '  them to generate src/locales/, which is untracked.'
            echo
            echo "Restore them from the BASE branch, not from HEAD — by the time this gate fires the change is"
            echo "already committed, so --source=HEAD would restore the very version being rejected:"
            # $base, not a hard-coded origin/main: the job already computed the real base ref, and a literal
            # would print the wrong instruction the moment this runs against any other base branch.
            echo "  git restore --source=$base --worktree -- i18n/*.po"
            exit 1
          fi
          echo "No Weblate-owned catalogue was modified outside Weblate."

  changelog-section:
    # package.json's version must already be described in CHANGELOG.md. The release workflow enforces
    # the same thing, but only once a tag exists — and a tag here is immutable (the retag guard
    # rejects a moved one), so discovering a missing section at release time costs a version number
    # rather than an edit. Catching it on the pull request keeps it an edit.
    name: Changelog section for this version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        # The version read below runs on the pinned Node, as the release workflow's does.
        with:
          node-version: 20
      - name: CHANGELOG.md describes package.json's version
        shell: bash
        run: |
          ver="$(node -p "require('./package.json').version")"
          # Literal prefix match, as in the release workflow: a version carries `.` and `-`, which a
          # regex built from it would interpret, and the closing `]` is what stops `0.0.1` matching
          # the `0.0.1-alpha` heading. A section ends at the next version heading or at the first
          # link-reference definition (`[x.y.z]: https://…`), so the definitions after the last
          # section are not counted as its content.
          section="$(awk -v want="## [$ver]" '
            index($0, want) == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside && $0 ~ /^\[[^]]+\]: / { exit }
            inside { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no non-empty '## [$ver]' section, but package.json declares $ver. Describe the version before releasing it."
            exit 1
          fi
          echo "CHANGELOG.md documents $ver."

  text-hygiene:
    # LF line endings and UTF-8 without a BOM on every committed text file.
    #
    # Worth an explicit check because the defect is invisible locally: with `* text=auto` declared, a tool
    # writing CRLF into the working tree still produces an LF blob and a clean `git status`, so the index
    # can essentially never report it. @dhis2/cli-style's Prettier config already sets endOfLine: 'lf',
    # so this and the JavaScript tooling agree; nothing here contradicts the other.
    name: Text-file hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check line endings and encoding
        shell: pwsh
        run: |
          $failures = @()
          # git ls-files --eol emits: i/<idx>  w/<worktree>  attr/<attrs><TAB><path>. Split the path off the
          # TAB first so an attribute containing a space cannot shift the column indices.
          $rows = foreach ($line in (git ls-files --eol)) {
            $parts = $line -split "`t", 2
            if ($parts.Count -lt 2) { continue }
            $cols = @($parts[0] -split '\s+' | Where-Object { $_ })
            if ($cols.Count -lt 2) { continue }
            $attr = if ($cols.Count -gt 2) { ($cols[2..($cols.Count - 1)] -join ' ') -replace '^attr/', '' } else { '' }
            # Only the ATTRIBUTE exempts a path. The i/ and w/ columns report what git DETECTED, and folding
            # them in here would let one stray byte skip the line-ending, BOM and UTF-8 checks at once — a
            # single NUL or even a lone CR makes git report -text — so a CRLF UTF-16 file would commit
            # silently, which is the corruption this job exists to catch.
            [pscustomobject]@{
              Index = $cols[0]; Worktree = $cols[1]; File = $parts[1]
              IsBinary = ($attr -match '(^|\s)(-text|binary)(\s|$)')
              LooksBinary = ($cols[0] -eq 'i/-text' -or $cols[1] -eq 'w/-text')
            }
          }
          foreach ($row in $rows) {
            if ($row.IsBinary) { continue }
            # Declared text but detected binary: report it, because nothing else can see this defect — git
            # prints -text rather than crlf, a NUL is valid UTF-8, and UTF-16 carries no UTF-8 BOM.
            if ($row.LooksBinary) {
              $failures += "$($row.File): declared text but git detects binary content (a NUL byte or stray CR) - probably mis-encoded; declare it '-text' if it really is binary"
              continue
            }
            if ($row.Worktree -in @('w/crlf', 'w/mixed')) {
              $failures += "$($row.File): $($row.Worktree.Substring(2)) line endings in the working tree"
            } elseif ($row.Index -in @('i/crlf', 'i/mixed')) {
              $failures += "$($row.File): $($row.Index.Substring(2)) line endings in the index"
            }
          }
          $strict = [System.Text.UTF8Encoding]::new($false, $true)
          foreach ($row in ($rows | Where-Object { -not $_.IsBinary })) {
            $full = Join-Path (Get-Location) $row.File
            if (-not (Test-Path -LiteralPath $full -PathType Leaf)) { continue }
            # Absolute path: .NET resolves a relative one against the process working directory, not
            # PowerShell's location, so a relative path here reads the wrong file or nothing at all.
            $bytes = [System.IO.File]::ReadAllBytes($full)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              $failures += "$($row.File): starts with a UTF-8 BOM"; continue
            }
            try { [void]$strict.GetString($bytes) } catch { $failures += "$($row.File): not valid UTF-8" }
          }
          if ($failures.Count) {
            $failures | Sort-Object | ForEach-Object { Write-Output "::error file=$($_.Split(':')[0])::$_" }
            Write-Output "Expected LF line endings and UTF-8 without a BOM. See .gitattributes and .editorconfig."
            exit 1
          }
          # A run that inspected nothing must not report success. With no rows, every check above passes
          # vacuously, so this job would print OK and exit 0 having looked at nothing — a result
          # indistinguishable from a healthy checkout, on exactly the defect it exists to catch.
          $checked = @($rows | Where-Object { -not $_.IsBinary })
          if ($checked.Count -eq 0) {
            # Two states reach here and they need different fixes, so the message must not name only one:
            # the repository tracks nothing at all, or it tracks files and git reports every one of them
            # binary — which a .gitattributes regression produces, and which is the more likely and the
            # more misleading, since the checkout looks entirely normal.
            Write-Output '::error::Cannot check text-file hygiene: nothing was inspected. Either no paths are tracked, or git reports every tracked path as binary — check .gitattributes before assuming the checkout is empty.'
            exit 1
          }
          Write-Output "Text-file hygiene OK: $($checked.Count) file(s)."

  validate:
    name: Typecheck + schema drift + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Validate (typecheck + schema drift + tests)
        run: yarn validate
      - name: Build the app bundle (smoke-test)
        run: yarn build
